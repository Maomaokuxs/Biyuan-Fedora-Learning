# 由 theme-sync.sh 自动生成 - 完美解决孤儿三角与透明穿透

# 1. 全局布局：干掉所有硬编码的三角形，让模块自我管理！
format = """
$os$username$directory$git_branch$git_status$nodejs$python$c$rust$golang$time$cmd_duration$line_break$character"""

[os]
disabled = false
# 开头自带左圆角 
format = "[](#57585a)[ ](bg:#57585a fg:#020202)"

[username]
show_always = true
# 核心魔法：用户名结束后，自带向右的三角符号 ，平滑过渡到 MUTED 颜色
format = "[ $user ](bg:#57585a fg:#020202)[](fg:#57585a bg:#0a0a0a)"

[directory]
# 目录以及后面的模块全部统一使用 MUTED 背景，消除多余的色块断层
format = "[ $path ](bg:#0a0a0a fg:#faf7f4)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
# Git 等动态模块保持背景一致，只用高亮颜色 (ACCENT) 突出图标，极其优雅
format = "[ $symbol $branch ](fg:#57585a bg:#0a0a0a)"

[git_status]
# 方案：移除复杂的嵌套，使用标准变量组
format = '([\[$all_status$ahead_behind\] ](fg:#57585a bg:#0a0a0a))'

[nodejs]
symbol = ""
format = "[ $symbol( $version) ](fg:#57585a bg:#0a0a0a)"

[python]
symbol = ""
format = "[ $symbol( $version) ](fg:#57585a bg:#0a0a0a)"

[time]
disabled = false
time_format = "%R"
# 结尾自带右圆角 ，完美收尾
format = "[  $time ](bg:#0a0a0a fg:#faf7f4)[ ](fg:#0a0a0a)"

[character]
success_symbol = '[❯](bold fg:#57585a)'
error_symbol = '[❯](bold fg:red)'
