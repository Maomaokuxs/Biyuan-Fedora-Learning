format = """$os$username$directory$git_branch$git_status$time$line_break$character"""
[os]
disabled = false
format = "[](#67606c)[ ](bg:#67606c fg:#0c0c0d)"
[username]
show_always = true
format = "[ $user ](bg:#67606c fg:#0c0c0d)[](fg:#67606c bg:#323439)"
[directory]
format = "[ $path ](bg:#323439 fg:#ffffff)"
truncation_length = 3
[git_branch]
symbol = ""
format = "[ $symbol $branch ](fg:#67606c bg:#323439)"
[git_status]
format = "[$all_status$ahead_behind](fg:#67606c bg:#323439)"
[time]
disabled = false
format = "[  $time ](bg:#323439 fg:#ffffff)[ ](fg:#323439)"
[character]
success_symbol = '[❯](bold fg:#67606c)'
error_symbol = '[❯](bold fg:red)'
