format = """$os$username$directory$git_branch$git_status$time$line_break$character"""
[os]
disabled = false
format = "[](#39393a)[ ](bg:#39393a fg:#1e1e2e)"
[username]
show_always = true
format = "[ $user ](bg:#39393a fg:#1e1e2e)[](fg:#39393a bg:#010102)"
[directory]
format = "[ $path ](bg:#010102 fg:#ffffff)"
truncation_length = 3
[git_branch]
symbol = ""
format = "[ $symbol $branch ](fg:#39393a bg:#010102)"
[git_status]
format = "[$all_status$ahead_behind](fg:#39393a bg:#010102)"
[time]
disabled = false
format = "[  $time ](bg:#010102 fg:#ffffff)[ ](fg:#010102)"
[character]
success_symbol = '[❯](bold fg:#39393a)'
error_symbol = '[❯](bold fg:red)'
