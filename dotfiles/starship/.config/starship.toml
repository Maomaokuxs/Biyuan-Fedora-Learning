format = """$os$username$directory$git_branch$git_status$time$line_break$character"""
[os]
disabled = false
format = "[](#9e5975)[ ](bg:#9e5975 fg:#1e1e2e)"
[username]
show_always = true
format = "[ $user ](bg:#9e5975 fg:#1e1e2e)[](fg:#9e5975 bg:#2a2b3c)"
[directory]
format = "[ $path ](bg:#2a2b3c fg:#ffdcf7)"
truncation_length = 3
[git_branch]
symbol = ""
format = "[ $symbol $branch ](fg:#9e5975 bg:#2a2b3c)"
[git_status]
format = "[$all_status$ahead_behind](fg:#9e5975 bg:#2a2b3c)"
[time]
disabled = false
format = "[  $time ](bg:#2a2b3c fg:#ffdcf7)[ ](fg:#2a2b3c)"
[character]
success_symbol = '[❯](bold fg:#9e5975)'
error_symbol = '[❯](bold fg:red)'
