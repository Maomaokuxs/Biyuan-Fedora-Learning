format = """$os$username$directory$git_branch$git_status$time$line_break$character"""
[os]
disabled = false
format = "[](#7b7b7b)[ ](bg:#7b7b7b fg:#050505)"
[username]
show_always = true
format = "[ $user ](bg:#7b7b7b fg:#050505)[](fg:#7b7b7b bg:#161615)"
[directory]
format = "[ $path ](bg:#161615 fg:#ffffff)"
truncation_length = 3
[git_branch]
symbol = ""
format = "[ $symbol $branch ](fg:#7b7b7b bg:#161615)"
[git_status]
format = "[$all_status$ahead_behind](fg:#7b7b7b bg:#161615)"
[time]
disabled = false
format = "[  $time ](bg:#161615 fg:#ffffff)[ ](fg:#161615)"
[character]
success_symbol = '[❯](bold fg:#7b7b7b)'
error_symbol = '[❯](bold fg:red)'
