general {
    # 锁定屏幕的动作
    lock_cmd = pidof hyprlock || hyprlock
    
    # 核心保险：无论是自动休眠、还是你通过脚本/命令行触发休眠
    # 系统都会先执行这个锁定指令，确保你醒来时绝对是锁屏状态
    before_sleep_cmd = loginctl lock-session
    
    # 唤醒后的动作：点亮屏幕 (Niri 专属命令)；
    # 顺带 10 秒后刷一次天气（网络刚恢复时直接刷必失败还污染缓存，等 10 秒再刷；
    # weather.py 失败不覆盖旧缓存 + 10 分钟退避；waybar 发信号即时刷，
    # quickshell 无信号通道，--fetch 预热缓存，pill 下次轮询/点击即显示新值）
    after_sleep_cmd = niri msg action power-on-monitors; (sleep 10; pkill -RTMIN+10 waybar; python3 ~/Documents/quickshell/scripts/common/weather.py --fetch &>/dev/null &) &
}

# 规则 1：5 分钟 (300秒) 闲置自动锁屏
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 规则 1.5：10 分钟 (600秒) 闲置自动熄屏，避免锁后一直亮着
listener {
    timeout = 600
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# 规则 2：15 分钟 (900秒) 闲置自动睡眠（sleep-safe.sh 先检查休眠支持度：
# 有物理 swap + resume= 参数才 hibernate，否则降级 suspend，再不行保底熄屏）
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/sleep-safe.sh
}
